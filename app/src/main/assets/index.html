<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <title>HanZi Writer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            overflow: hidden;
            background-color: transparent;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #character-target {
            width: 250px;
            height: 250px;
            background-color: #1a1a1a;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="character-target"></div>
    <script>
        let writer;
        let wordList = [];
        let wordIndex = 0;
        let charIndexInWord = 0;
        let showOutline = true;
        let isStarted = false;

        function drawCharacter(char) {
            if (typeof HanziWriter === 'undefined') {
                setTimeout(() => drawCharacter(char), 200);
                return;
            }

            if (writer) {
                try { writer.cancelQuiz(); } catch (e) {}
            }

            const target = document.getElementById('character-target');
            target.innerHTML = '';

            writer = HanziWriter.create('character-target', char, {
                width: 200,
                height: 200,
                showOutline: showOutline,
                strokeAnimationSpeed: 2,
                delayBetweenStrokes: 200,
                padding: 15,
                strokeColor: '#FFFFFF',
                outlineColor: '#444444',
                drawingColor: '#FFFFFF'
            });

            writer.quiz({
                onComplete: function(summaryData) {
                    charIndexInWord++;
                    const currentWord = wordList[wordIndex];

                    if (charIndexInWord < currentWord.length) {
                    if (window.Android){
                        window.Android.onIndexChange();
                    }
                        setTimeout(() => drawCharacter(currentWord[charIndexInWord]), 200);
                    } else {
                        if (window.Android) {
                            window.Android.onTaskComplete();
                        }
                        charIndexInWord = 0;
                        wordIndex++;
                        setTimeout(nextQuestion, 600);
                    }
                }
            });
        }

        function begin(randomTab, difficulty) {
            if (isStarted && wordList.length > 0) return;
            isStarted = true;

            wordList = randomTab;
            if (!wordList || wordList.length === 0) return;

            showOutline = (difficulty != 3);
            wordIndex = 0;
            charIndexInWord = 0;
            nextQuestion();
        }

        function nextQuestion() {
            if (wordIndex < wordList.length) {
                const currentWord = wordList[wordIndex];
                drawCharacter(currentWord[charIndexInWord]);
            } else {
                isStarted = false;
                if (window.Android) {
                    setTimeout(window.Android.onExerciseFinished(),400);
                }
            }
        }
    </script>
</body>
</html>
